<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан | Меню та Бронювання</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>🍷 RestoHub</h1>
            <nav>
                <a href="#" onclick="goToMenu()">Меню</a>
                <button class="header-cart-btn" onclick="goToCheckout()">
                    🛒 Кошик (<span id="header-cart-count">0</span>)
                </button>
            </nav>
        </div>
    </header>

    <main class="container">

        <div id="view-menu">
            <h2 style="margin-top: 40px;">Наше Меню</h2>
            <div id="menu-grid" class="menu-grid">
                <p class="loading">Завантаження меню з сервера...</p>
            </div>
        </div>

        <div id="view-checkout" class="hidden">
            <button class="back-btn" onclick="goToMenu()">← Повернутися до меню</button>

            <div class="checkout-container">
                <aside class="card-box">
                    <h2>Ваше замовлення 🛒</h2>
                    <ul id="cart-items" class="cart-list">
                        <li class="empty-cart">Кошик порожній</li>
                    </ul>
                    <div class="cart-footer">
                        <strong>Разом:</strong> <span id="total-price">0</span> грн
                    </div>
                </aside>

                <section class="card-box">
                    <h2>Оформлення 📅</h2>
                    <form id="reservation-form">
                        <div class="form-group">
                            <label for="clientName">Ваше ім'я</label>
                            <input type="text" id="clientName" placeholder="Олександр" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Номер телефону</label>
                            <input type="tel" id="phone" placeholder="+380..." required>
                        </div>
                        <div class="form-group">
                            <label for="bookingDate">Дата та час</label>
                            <input type="datetime-local" id="bookingDate" required>
                        </div>
                        <div class="form-group">
                            <label for="guestsCount">Кількість гостей (1-20)</label>
                            <input type="number" id="guestsCount" min="1" max="20" placeholder="Наприклад: 4" required>
                        </div>
                        <button type="submit" class="btn-primary">Підтвердити бронь</button>
                    </form>
                    <div id="reservation-message" class="hidden"></div>
                </section>
            </div>
        </div>

    </main>

    <script src="app.js?v=4"></script>

    <div id="dishModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" alt="Фото страви">
            <h3 id="modalTitle">Назва</h3>
            <p id="modalDesc">Опис страви</p>
            <p id="modalCalories" class="calories-badge"></p>
        </div>
    </div>
</body>
</html>
