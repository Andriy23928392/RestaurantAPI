<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Шеф-Кухаря | RestoHub</title>
    <link rel="stylesheet" href="admin-style.css?v=11">
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="color: #ffffff; margin-bottom: 20px;">Вхід для Шефа 👨‍🍳</h2>
            <input type="password" id="chef-password" placeholder="Секретний пароль...">
            <button id="login-btn">Увійти</button>
            <p id="login-error" style="color: #cf6679; margin-top: 15px; display: none; font-weight: bold;">Невірний пароль!</p>
        </div>
    </div>

    <div class="admin-wrapper">
        <header class="admin-header">
            <div>
                <h1>Управління RestoHub</h1>
            </div>
            <div class="header-controls">
                <div class="tab-buttons">
                    <button id="tab-menu" class="tab-btn active">🍽️ Меню</button>
                    <button id="tab-reservations" class="tab-btn">📅 Бронювання</button>
                </div>
                <div class="user-badge">Шеф-Кухар 👨‍🍳</div>
            </div>
        </header>

        <div id="section-menu">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="stat-bookings">0</div>
                    <div class="stat-label">Всього замовлень 📅</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-guests">0</div>
                    <div class="stat-label">Всього гостей 👥</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-avg">0</div>
                    <div class="stat-label">Гостей у середньому на стіл 🍽️</div>
                </div>
            </div>

            <h2 style="margin-bottom: 1rem;">Управління наявністю страв</h2>
            <div class="table-container">
                <table class="menu-table">
                    <thead>
                        <tr>
                            <th>Фото</th>
                            <th>Назва та опис</th>
                            <th>Ціна (грн)</th>
                            <th>Калорії</th>
                            <th>Доступність</th>
                        </tr>
                    </thead>
                    <tbody id="menu-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="section-reservations" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Архів бронювань</h2>
                <button id="export-excel-btn" class="btn-action">📥 Експорт в Excel (CSV)</button>
            </div>

            <div class="table-container">
                <table class="menu-table">
                    <thead>
                        <tr>
                            <th>Ім'я клієнта</th>
                            <th>Телефон</th>
                            <th>Дата та час</th>
                            <th>К-ть гостей</th>
                        </tr>
                    </thead>
                    <tbody id="reservations-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="admin-app.js?v=11"></script>
</body>
</html>
